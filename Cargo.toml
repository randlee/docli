[package]
name = "docli"
version = "0.1.0"
edition = "2021"
description = "Language-agnostic CLI documentation generator: HTML + Markdown from a neutral command-tree JSON"
license = "MIT"
repository = "https://github.com/randlee/docli"
readme = "README.md"

[lib]
name = "docli"
path = "src/lib.rs"

[[bin]]
name = "docli"
path = "src/main.rs"

[[bin]]
name = "cargo-docli"
path = "src/bin/cargo-docli.rs"

[[bin]]
name = "gen-fixtures"
path = "src/bin/gen-fixtures.rs"
required-features = ["gen-fixtures"]

[[bin]]
name = "dump-cli-model"
path = "src/bin/dump-cli-model.rs"

[features]
gen-fixtures = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
include_dir = "0.7.4"
minijinja = { version = "3.0.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1.7"
