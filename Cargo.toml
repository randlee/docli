[package]
name = "docli"
version = "0.1.0"
edition = "2021"
description = "Language-agnostic CLI documentation generator: HTML + Markdown from a neutral command-tree JSON"
license = "MIT"
repository = "https://github.com/randlee/docli"
readme = "README.md"

[lib]
name = "docli"
path = "src/lib.rs"

[[bin]]
name = "docli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
